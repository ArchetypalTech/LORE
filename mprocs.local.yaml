    shell: wait-port 5050 && torii --version && torii --world "0x1142a4bd443a08f68936caf2e6b5d32121eb3b0327ff5a75b0b92d50cbdc913" --http.cors_origins "*" --indexing.contracts erc721:0x02fa73d2c20fef6f23a84f3ef3b6e99ec2fa819f0b5acf2be6695544b87922e5
  katana:
    cwd: packages/contracts
    shell: katana --version && katana --dev --dev.no-fee --http.cors_origins "*" --cartridge.controllers --cartridge.paymaster
