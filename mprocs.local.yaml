    shell: wait-port 5050 && torii --version && torii --world "0x0189849c1a8851e3ad29a83c92ae7bee9d1e5fb3b9aff33eb61493f402580f1a" --http.cors_origins "*" --indexing.contracts erc721:0x0751d5c13b9bd01786fdc7b887151aa81a09bdb3c46c0df2aea1895faeccda6d
  katana:
    cwd: packages/contracts
    shell: katana --version && katana --dev --dev.no-fee --http.cors_origins "*" --cartridge.controllers --cartridge.paymaster
