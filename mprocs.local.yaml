procs:
  katana:
    cwd: packages/contracts
    shell: |
      katana --version
      katana --dev --dev.no-fee --http.cors_origins "*" --cartridge.controllers --cartridge.paymaster --config ./config_katana_dev.toml
  contracts:
    cwd: packages/contracts
    shell: |
      wait-port 5050
      bun run dev:watch
  client:
    cwd: packages/client
    shell: bun run dev
  torii:
    cwd: packages/contracts
    env:
      PROFILE: dev
    shell: |
      torii --config ./config_torii_dev.toml
