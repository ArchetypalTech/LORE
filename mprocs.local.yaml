    shell: wait-port 5050 && torii --version && torii --world "0xc78460f5ff06e806f956d410c70e3c26c3948f34356eca4c401f1f8ded5dc" --http.cors_origins "*" --indexing.contracts erc721:0x02e7076c4edfe7e9bb0d896357e413de1c62e666dbc6f6985c8d2d0da2a34d1b
  katana:
    cwd: packages/contracts
    shell: katana --version && katana --dev --dev.no-fee --http.cors_origins "*" --cartridge.controllers --cartridge.paymaster
