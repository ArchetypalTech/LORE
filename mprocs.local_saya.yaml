procs:
  initializer:
    cwd: packages/contracts
    env:
      PROFILE: dev
    shell: |
      set -e # exit on error
      source ../../scripts/utils.sh
      #----------------
      # delete targets to wait for a fresh deployment
      echo ">>> Initializing..."
      rm -rf ./target/${PROFILE}
      rm -rf ../starknet/target/${PROFILE}
      rm -rf ../starknet/data/${PROFILE}
      #----------------
      # set_appchain_contract()
      #
      echo ">>> Waiting for L3 deployment..."
      wait-on -l ./target/${PROFILE}/deployed
      export APPCHAIN_ADDRESS=$(get_contract_address ${PROFILE} lore-actions_lore)
      #----------------
      echo ">>> L2: set_appchain_contract(${APPCHAIN_ADDRESS})"
      cd ../starknet
      sozo -P ${PROFILE} execute --wait lore_strk-actions_strk set_appchain_contract ${APPCHAIN_ADDRESS}
      sozo -P ${PROFILE} model get lore_strk-MessagingConfig 1
      export SN_ADDRESS=$(get_contract_address ${PROFILE} lore_strk-actions_strk)
      #----------------
      echo ">>> L3: set_sn_contract(${SN_ADDRESS})"
      cd ../contracts
      sozo -P ${PROFILE} execute --wait lore-actions_lore set_sn_contract ${SN_ADDRESS}
      sozo -P ${PROFILE} model get lore-ActionsConfig 1
      #----------------
      echo "👍 Done!"
  l2_katana:
    cwd: packages/starknet
    env:
      KATANA_L2_PORT: "50000"
    shell: |
      echo "Starting L2 Katana on port [${KATANA_L2_PORT}]..."
      katana --version
      katana --dev --dev.no-fee --http.port ${KATANA_L2_PORT}
  l2_contracts:
    cwd: packages/starknet
    env:
      PROFILE: dev
      KATANA_L2_PORT: "50000"
      KATANA_L2_RPC: http://localhost:50000
      KATANA_L3_BIN: ./bin/katana_l3
      SETTLEMENT_ACCOUNT_ADDRESS: 0x127fd5f1fe78a71f8bcd1fec63e3fe2f0486b6ecd5c86a0466c3a21fa5cfcec
      SETTLEMENT_ACCOUNT_PRIVATE_KEY: 0xc5b2fcab997346f3ea1c00b002ecf6f382c5f9c9659a3894eb783c5320f912
      FACT_REGISTRY_MOCK_ADDRESS: 0x0574b73e6db9e1d7e875a15c52ac9de7b62873c5702eeedede54c8004fa405cb
    shell: |
      sleep 1
      set -e # exit on error
      source ../../scripts/utils.sh
      export DOJO_WORLD_ADDRESS=$(get_profile_env ${PROFILE} world_address)
      echo ">>> Dojo world: [${DOJO_WORLD_ADDRESS}]"
      #----------------
      # based on:
      # https://github.com/glihm/starknet-messaging-dev/tree/l2-l3-saya?tab=readme-ov-file#setup-the-l2-starknet
      #
      echo ">>> Deploying L2 mocked fact registry contract..."
      sozo -P ${PROFILE} build
      sozo declare target/dev/lore_strk_fact_registry_mock.contract_class.json \
        --katana-account katana0 \
        --rpc-url ${KATANA_L2_RPC}
      sozo deploy 0x0056289bc807ecf889aee508909d6902ddf4b6cd77d7d0aaaeb5adc7aca3bd23 \
        --katana-account katana0 \
        --salt 0x1234 \
        --rpc-url ${KATANA_L2_RPC}
      # will output: FACT_REGISTRY_MOCK_ADDRESS
      echo "!!! Validate: FACT_REGISTRY_MOCK_ADDRESS=${FACT_REGISTRY_MOCK_ADDRESS}"
      #----------------
      # katana_l3 init
      #
      echo ">>> Creating Katana L3 config..."
      export DATA_PATH=./data/${PROFILE}
      mkdir -p ${DATA_PATH}
      ${KATANA_L3_BIN} init \
        --settlement-chain ${KATANA_L2_RPC} \
        --id katana-l3 \
        --settlement-account-private-key ${SETTLEMENT_ACCOUNT_PRIVATE_KEY} \
        --settlement-account-address ${SETTLEMENT_ACCOUNT_ADDRESS} \
        --settlement-facts-registry ${FACT_REGISTRY_MOCK_ADDRESS} \
        --output-path ${DATA_PATH}
      # will output: PILTOVER_ADDRESS
      #----------------
      # validate piltover address
      #
      PILTOVER_ADDRESS=$(grep '^core_contract' ${DATA_PATH}/config.toml | sed -E 's/core_contract = "([^"]+)"/\1/')
      echo "!!! Validate: PILTOVER_ADDRESS=${PILTOVER_ADDRESS}"
      #----------------
      # deploy contracts...
      #
      wait-port ${KATANA_L2_PORT}
      echo ">>> Deploying contracts..."
      sozo -P ${PROFILE} inspect
      sozo -P ${PROFILE} migrate
      touch target/${PROFILE}/deployed
      #----------------
      # set_messaging_contract()
      #
      echo ">>> L2: set_messaging_contract(${PILTOVER_ADDRESS})"
      sozo -P ${PROFILE} execute --wait lore_strk-actions_strk set_messaging_contract ${PILTOVER_ADDRESS}
      sozo -P ${PROFILE} model get lore_strk-MessagingConfig 1
      #----------------
      echo "👍 Done!"
  l3_katana:
    cwd: packages/starknet
    env:
      PROFILE: dev
      KATANA_L3_BIN: ./bin/katana_l3
      KATANA_L3_PORT: "5050"
      BLOCK_TIME: "30000"
      MAX_CAIRO_STEPS: "16000000"
    shell: |
      sleep 1
      #----------------
      # wait for katana_l3 init file
      #
      sleep 1
      export DATA_PATH=./data/${PROFILE}
      echo ">>> Waiting for L3 init config... [${DATA_PATH}/config.toml]"
      wait-on -l ${DATA_PATH}/config.toml
      #----------------
      # start katana L3...
      #
      echo ">>> Starting L3 Katana on port [${KATANA_L3_PORT}]..."
      ${KATANA_L3_BIN} --version
      ${KATANA_L3_BIN} \
        --dev --dev.no-fee --dev.accounts 10 \
        --http.cors_origins "*" \
        --http.port ${KATANA_L3_PORT} \
        --cartridge.controllers --cartridge.paymaster \
        --chain ${DATA_PATH} \
        # --block-time ${BLOCK_TIME} --sequencing.block-max-cairo-steps ${MAX_CAIRO_STEPS}
  l3_contracts:
    cwd: packages/contracts
    env:
      KATANA_L3_PORT: "5050"
    shell: |
      sleep 1
      #----------------
      # wait for katana_l3 init
      wait-port ${KATANA_L3_PORT}
      #----------------
      bun run dev:watch
  saya:
    cwd: packages/starknet
    env:
      PROFILE: dev
      RUST_LOG: saya=debug
      KATANA_L2_RPC: http://localhost:50000
      KATANA_L3_RPC: http://localhost:5050
      KATANA_L2_PORT: "50000"
      KATANA_L3_PORT: "5050"
      SETTLEMENT_ACCOUNT_ADDRESS: 0x127fd5f1fe78a71f8bcd1fec63e3fe2f0486b6ecd5c86a0466c3a21fa5cfcec
      SETTLEMENT_ACCOUNT_PRIVATE_KEY: 0xc5b2fcab997346f3ea1c00b002ecf6f382c5f9c9659a3894eb783c5320f912
    shell: |
      sleep 1
      set -e # exit on error
      #----------------
      export DATA_PATH=./data/${PROFILE}
      echo ">>> Waiting for L3 init config... [${DATA_PATH}/config.toml]"
      wait-on -l ${DATA_PATH}/config.toml
      PILTOVER_ADDRESS=$(grep '^core_contract' ${DATA_PATH}/config.toml | sed -E 's/core_contract = "([^"]+)"/\1/')
      echo ">>> PILTOVER_ADDRESS: [${PILTOVER_ADDRESS}]"
      #----------------
      # wait for katana_l3 init
      wait-port ${KATANA_L2_PORT}
      wait-port ${KATANA_L3_PORT}
      #----------------
      # sytart saya
      #
      export DB_DIR=${DATA_PATH}
      saya --version
      saya persistent start \
        --settlement-rpc ${KATANA_L2_RPC} \
        --settlement-piltover-address ${PILTOVER_ADDRESS} \
        --settlement-account-address ${SETTLEMENT_ACCOUNT_ADDRESS} \
        --settlement-account-private-key ${SETTLEMENT_ACCOUNT_PRIVATE_KEY} \
        --rollup-rpc ${KATANA_L3_RPC} \
        --mock-snos-from-pie \
        --mock-layout-bridge-program-hash 0x43c5c4cc37c4614d2cf3a833379052c3a38cd18d688b617e2c720e8f941cb8
  client:
    cwd: packages/client
    env:
      KATANA_L3_PORT: "5050"
    shell: |
      sleep 1
      #----------------
      wait-port ${KATANA_L3_PORT}
      #----------------
      bun run dev
  torii:
    cwd: packages/contracts
    env:
      PROFILE: dev
      KATANA_L3_PORT: "5050"
    shell: |
      sleep 1
      set -e # exit on error
      source ../../scripts/utils.sh
      export DOJO_WORLD_ADDRESS=$(get_profile_env ${PROFILE} world_address)
      export GAME_TOKEN_ADDRESS=$(get_contract_address ${PROFILE} lore-game_token)
      export TRAIL_TOKEN_ADDRESS=$(get_contract_address ${PROFILE} lore-trail_token)
      echo ">>> Dojo world: [${DOJO_WORLD_ADDRESS}]"
      echo ">>> Game token: [${GAME_TOKEN_ADDRESS}]"
      echo ">>> Trail token: [${TRAIL_TOKEN_ADDRESS}]"
      #----------------
      wait-port ${KATANA_L3_PORT}
      #----------------
      # start Torii
      torii --version
      torii --http.cors_origins "*" \
        --indexing.contracts erc721:${GAME_TOKEN_ADDRESS},erc721:${TRAIL_TOKEN_ADDRESS}
