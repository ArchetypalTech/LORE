[package]
name = "lore_sn"
version = "0.2.0"
edition = "2024_07"
cairo-version = ">=2.13.1"

[cairo]
sierra-replace-ids = true

[dependencies]
starknet = ">=2.13.1"
dojo = "=1.8.0"
openzeppelin_token = { git = "https://github.com/OpenZeppelin/cairo-contracts", tag = "v1.0.0" }
openzeppelin_access = { git = "https://github.com/OpenZeppelin/cairo-contracts", tag = "v1.0.0" }
openzeppelin_introspection = { git = "https://github.com/OpenZeppelin/cairo-contracts", tag = "v1.0.0" }
nft_combo = { git = "https://github.com/underware-gg/cairo-nft-combo", branch = "dojo_v1.7.0" }
# piltover = { git = "https://github.com/cartridge-gg/piltover.git", rev = "c25af3d" }

[dev-dependencies]
cairo_test = ">=2.13.1"
dojo_cairo_test = "=1.8.0"

[tool.scarb]
allow-prebuilt-plugins = ["dojo_cairo_macros"]

[[target.starknet-contract]]
build-external-contracts = ["dojo::world::world_contract::world"]
allowed-libfuncs-list.name = "experimental"

# debug contract size issues
# needed by `sozo build --stats.by-tag`
# https://docs.starknet.io/resources/chain-info/
# max felts = 81,920 felts
# casm = true

#--------------------------
# Dojo profiles declaration
#
[profile.dev]
[profile.saya-test]
