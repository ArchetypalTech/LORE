[package]
name = "lore"
cairo-version = "=2.10.1"
version = "0.1.1"
edition = "2024_07"
experimental-features = ["associated_item_constraints"]

[cairo]
sierra-replace-ids = true

[scripts]
migrate = "sozo build && sozo migrate apply"

[dependencies]
dojo = { git = "https://github.com/dojoengine/dojo", tag = "v1.6.1" }
origami_random = { git = "https://github.com/dojoengine/origami", tag = "v1.6.1" }
# not used right now but initialised in dojo_init when used for deli interop
# planetary_interface = { path = "/Users/tims/DATA/BB/dojo/planetary/dojo/planetary_interface" }
# starknet = "2.8.4"

[dev-dependencies]
cairo_test = "=2.10.1"
dojo_cairo_test = { git = "https://github.com/dojoengine/dojo", tag = "v1.6.1" }

[[target.starknet-contract]]
build-external-contracts = ["dojo::world::world_contract::world"]
allowed-libfuncs-list.name = "experimental"

# debug contract size (max=81,920 felts)
# to be used with `sozo build --stats.by-tag`
# https://docs.starknet.io/resources/chain-info/
# uncomment this...
# sierra = true
# casm = true

# Dojo profiles
[profile.dev]
[profile.slot]
[profile.local]
