[package]
name = "lore"
cairo-version = "=2.12.1"
version = "0.1.1"
edition = "2024_07"
experimental-features = ["associated_item_constraints"]

[cairo]
sierra-replace-ids = true
inlining-strategy = "avoid"

[scripts]
migrate = "sozo build && sozo migrate apply"

[dependencies]
dojo = { git = "https://github.com/dojoengine/dojo", rev = "7f9279141d209f89e01994f1667e3f0ba1a4bef6" }
origami_random = { git = "https://github.com/dojoengine/origami", tag = "v1.6.1" }
dojo_macros = { git = "https://github.com/dojoengine/dojo", rev = "7f9279141d209f89e01994f1667e3f0ba1a4bef6" }
# not used right now but initialised in dojo_init when used for deli interop
# planetary_interface = { path = "/Users/tims/DATA/BB/dojo/planetary/dojo/planetary_interface" }
starknet = "2.12.1"

[dev-dependencies]
cairo_test = "2.12.1"
dojo_cairo_test = { git = "https://github.com/dojoengine/dojo", rev = "7f9279141d209f89e01994f1667e3f0ba1a4bef6" }

[[target.starknet-contract]]
build-external-contracts = ["dojo::world::world_contract::world"]
allowed-libfuncs-list.name = "experimental"

[profile.dev]

[profile.slot]

[profile.local]
