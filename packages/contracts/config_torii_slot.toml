#
# torii config for profile [dev] 
# instance [orug-slot]
#

# world
world_address = "0x05dee2ca4cf9c091f17f4607cc048639017fbc2288daf66d8f2f929e61edeeb2"
rpc = "https://api.cartridge.gg/x/orug-slot/katana"

[runner]
explorer = true              # Open World Explorer in browser (default: false)
check_contracts = false       # Verify contracts before starting (default: false)

[indexing]
contracts = [
  "erc721:0x6962da1f222d4c4209110aa24d0482c672678aa22fa91975b3bac65c5e09d67", # game_token
  "erc721:0x97e9a41ae85099766f59ba50486b57b7236030389e4ac31ccd46d75039de2a", # trail_token
]

# Performance tuning
events_chunk_size = 1024        # Events per RPC request (default: 1024)
blocks_chunk_size = 10240       # Blocks per DB commit (default: 10240)
polling_interval = 350          # Check interval in ms (default: 500)
max_concurrent_tasks = 100      # Parallel processing (default: 100)

# Content selection
pending = true                 # Include pending transactions
transactions = true            # Store transaction data
namespaces = []                # Specific namespaces only (empty = all)
world_block = 0                # Starting block number (default: 0)


# Advanced options
controllers = false             # Index Cartridge controllers (default: false)
strict_model_reader = false     # Read models from registration block (default: false)
batch_chunk_size = 1024         # Batch request chunk size (default: 1024)

[events]
raw = false                     # Store raw blockchain events (dev only)

[erc]
max_metadata_tasks = 50    # Concurrent metadata tasks (default: 100)

[sql]
page_size = 4096              # Page size in bytes (default: 32768, range: 512-65536)
cache_size = -500000           # Cache size: negative = KiB, positive = pages (default: -500MB)
all_model_indices = false      # Auto-create all indices (resource intensive)

# Historical data retention
historical = ["lore-TrophyProgression"]

# metrics: they are always served on /metrics endpoint of the deployment (only for slot instances)