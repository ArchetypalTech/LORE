name: LORE CI

on:
  push:
    branches:
      - main
      - develop
      - fix/ci
  pull_request:

env:
  DOJO_VERSION: 1.7.0-alpha.4
  SCARB_VERSION: 2.13.1
  # KATANA_VERSION: 1.6.3
  # TORII_VERSION: 1.6.0

jobs:
  check:
    runs-on: ubuntu-latest
    name: Contracts / Check format
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Format
        run: cd packages/contracts && scarb fmt --check
        shell: bash

