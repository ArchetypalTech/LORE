  client:
    runs-on: ubuntu-latest
    name: Client / Lint
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Client
        run: cd packages/client && bun i && bun run lint:ci
        shell: bash
