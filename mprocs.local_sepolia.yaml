procs:
  initializer:
    cwd: packages/contracts
    env:
      L2_PROFILE: sepolia
      L3_PROFILE: appchain-sepolia
    shell: |
      set -e # exit on error
      source ../../scripts/utils.sh
      #----------------
      # delete targets to wait for a fresh deployment
      echo ">>> Initializing..."
      rm -rf ../contracts/target/${L3_PROFILE}
      rm -rf ../starknet/target/${L2_PROFILE}
      rm -rf ../starknet/data/${L2_PROFILE}
      #----------------
      echo ">>> Waiting for L3 deployment..."
      wait-on -l ../starknet/target/${L2_PROFILE}/deployed
      wait-on -l ../contracts/target/${L3_PROFILE}/deployed
      export APPCHAIN_ADDRESS=$(get_contract_address ${L3_PROFILE} lore-actions_token)
      #----------------
      # Configure L2 (Starknet)
      #
      cd ../starknet
      source .env.dev-sepolia
      export PERMIT_TOKEN_ADDRESS=$(get_contract_address ${L2_PROFILE} lore_sn-permit_token)
      echo ">>> L2: [${L2_PROFILE}] set_messaging_contract(${PILTOVER_ADDRESS})"
      sozo -P ${L2_PROFILE} execute --wait lore_sn-setup set_messaging_contract ${PILTOVER_ADDRESS}
      echo ">>> L2: [${L2_PROFILE}] set_appchain_contract(${APPCHAIN_ADDRESS})"
      sozo -P ${L2_PROFILE} execute --wait lore_sn-setup set_appchain_contract ${APPCHAIN_ADDRESS}
      echo ">>> L2: [${L2_PROFILE}] PermitConfig:"
      sozo -P ${L2_PROFILE} model get lore_sn-PermitConfig 1
      touch ../starknet/target/${L2_PROFILE}/initialized
      source .env.clear
      #----------------
      # Configure L3 (Katana)
      #
      cd ../contracts
      echo ">>> L3: [${L3_PROFILE}] set_sn_contract(${PERMIT_TOKEN_ADDRESS})"
      sozo -P "${L3_PROFILE}" execute --wait lore-actions_token set_sn_contract ${PERMIT_TOKEN_ADDRESS}
      echo ">>> L3: [${L3_PROFILE}] ActionsConfig:"
      sozo -P "${L3_PROFILE}" model get lore-ActionsConfig 1
      touch ../contracts/target/${L3_PROFILE}/initialized
      #----------------
      echo "👍 Ready!!"
  l2_contracts:
    cwd: packages/starknet
    env:
      L2_PROFILE: sepolia
    shell: |
      sleep 1
      set -e # exit on error
      source ../../scripts/utils.sh
      source .env.dev-sepolia
      export DOJO_WORLD_ADDRESS=$(get_profile_env ${L2_PROFILE} world_address)
      echo ">>> Dojo world: [${DOJO_WORLD_ADDRESS}]"
      echo ">>> Deployer: [${DOJO_ACCOUNT_ADDRESS}]"
      #----------------
      # deploy contracts...
      #
      echo ">>> Deploying contracts..."
      sozo --version
      sozo -P ${L2_PROFILE} build --typescript
      sozo -P ${L2_PROFILE} inspect
      sozo -P ${L2_PROFILE} migrate
      #----------------
      touch ../starknet/target/${L2_PROFILE}/deployed
      echo "👍 L2 Ready!"
  l2_torii:
    cwd: packages/starknet
    env:
      L2_PROFILE: sepolia
      L2_TORII_PORT: "8280"
      L2_GRPC_PORT: "52050"
      L2_RELAY_PORT: "9290"
      L2_WEBRTC_PORT: "9291"
      L2_WEBSOCKET_PORT: "9292"
      L2_WORLD_BLOCK: "10508415"
    shell: |
      sleep 1
      set -e # exit on error
      source ../../scripts/utils.sh
      #----------------
      # wait for L2 to be deployed
      wait-on -l ../starknet/target/${L2_PROFILE}/deployed
      export RPC_URL=$(get_profile_env ${L2_PROFILE} rpc_url)
      export DOJO_WORLD_ADDRESS=$(get_profile_env ${L2_PROFILE} world_address)
      export PERMIT_TOKEN_ADDRESS=$(get_contract_address ${L2_PROFILE} lore_sn-permit_token)
      echo ">>> RPC: [${RPC_URL}]"
      echo ">>> Dojo world: [${DOJO_WORLD_ADDRESS}] block [${L2_WORLD_BLOCK}]"
      echo ">>> Permit token: [${PERMIT_TOKEN_ADDRESS}]"
      echo ">>> Torii ports: [${L2_TORII_PORT}] [${L2_GRPC_PORT}]"
      #----------------
      # start Torii
      torii --version
      torii --http.cors_origins "*" \
        --world ${DOJO_WORLD_ADDRESS} \
        --rpc ${RPC_URL} \
        --http.port ${L2_TORII_PORT} \
        --grpc.port ${L2_GRPC_PORT} \
        --relay.port ${L2_RELAY_PORT} \
        --relay.webrtc_port ${L2_WEBRTC_PORT} \
        --relay.websocket_port ${L2_WEBSOCKET_PORT} \
        --indexing.world_block ${L2_WORLD_BLOCK} \
        --indexing.contracts \
          erc721:${PERMIT_TOKEN_ADDRESS}
  l2_client:
    cwd: packages/client-sn
    env:
      L2_PROFILE: sepolia
    shell: |
      sleep 1
      set -e # exit on error
      #----------------
      # wait for L2 to be deployed and initialized
      wait-on -l ../starknet/target/${L2_PROFILE}/initialized
      #----------------
      # start client
      bun run dev
  l3_katana:
    cwd: packages/starknet
    env:
      KATANA_TEE_BIN: katana
      KATANA_PORT: "6969"
      CHAIN_CONFIG_PATH: ./data/dev-sepolia/chain-config
      CHAIN_DATA_PATH: ./data/dev-sepolia/chain-data
    shell: |
      sleep 1
      #----------------
      # wait for katana_l3 init file
      #
      sleep 1
      #----------------
      # start katana L3...
      # 
      # https://github.com/dojoengine/katana/blob/main/docs/tee-deployment.md#2-run-katana-dev
      #
      mkdir -p ${CHAIN_DATA_PATH}
      echo ">>> Starting L3 Katana on port [${KATANA_PORT}]..."
      ls -l ${KATANA_TEE_BIN}
      ${KATANA_TEE_BIN} --version
      ${KATANA_TEE_BIN} \
        --chain ${CHAIN_CONFIG_PATH} \
        --http.addr 0.0.0.0 \
        --http.port ${KATANA_PORT} \
        --http.cors-origins "*" \
        --explorer \
        --tee mock \
        --messaging.enabled \
        --dev --dev.no-fee \
        --data-dir ${CHAIN_DATA_PATH} \
        --invoke-max-steps   100000000 \
        --validate-max-steps  10000000
  l3_contracts:
    cwd: packages/contracts
    env:
      L3_PROFILE: appchain-sepolia
      KATANA_PORT: "6969"
      KATANA_CHAIN_ID: MY_APPCHAIN_DEV
    shell: |
      sleep 1
      set -e # exit on error
      source ../../scripts/utils.sh
      export DOJO_WORLD_ADDRESS=$(get_profile_env ${L3_PROFILE} world_address)
      echo ">>> Dojo world: [${DOJO_WORLD_ADDRESS}]"
      #----------------
      # wait for katana_l3 init
      wait-port ${KATANA_PORT}
      echo ">>> Deploying contracts..."
      sozo -P ${L3_PROFILE} build
      sozo -P ${L3_PROFILE} inspect
      sozo -P ${L3_PROFILE} migrate
      #----------------
      touch ../contracts/target/${L3_PROFILE}/deployed
      echo "👍 L2 Ready!"
  l3_torii:
    cwd: packages/contracts
    env:
      L3_PROFILE: appchain-sepolia
      L3_TORII_PORT: "8380"
      L3_GRPC_PORT: "53050"
      L3_RELAY_PORT: "9390"
      L3_WEBRTC_PORT: "9391"
      L3_WEBSOCKET_PORT: "9392"
    shell: |
      sleep 1
      set -e # exit on error
      source ../../scripts/utils.sh
      #----------------
      # wait for L3 to be deployed
      wait-on -l ../contracts/target/${L3_PROFILE}/deployed
      export RPC_URL=$(get_profile_env ${L3_PROFILE} rpc_url)
      export DOJO_WORLD_ADDRESS=$(get_profile_env ${L3_PROFILE} world_address)
      export ACTIONS_TOKEN_ADDRESS=$(get_contract_address ${L3_PROFILE} lore-actions_token)
      export GAME_TOKEN_ADDRESS=$(get_contract_address ${L3_PROFILE} lore-game_token)
      export TRAIL_TOKEN_ADDRESS=$(get_contract_address ${L3_PROFILE} lore-trail_token)
      echo ">>> RPC: [${RPC_URL}]"
      echo ">>> Dojo world: [${DOJO_WORLD_ADDRESS}]"
      echo ">>> Actions token: [${ACTIONS_TOKEN_ADDRESS}]"
      echo ">>> Game token: [${GAME_TOKEN_ADDRESS}]"
      echo ">>> Trail token: [${TRAIL_TOKEN_ADDRESS}]"
      echo ">>> Torii ports: [${L3_TORII_PORT}] [${L3_GRPC_PORT}]"
      #----------------
      # start Torii
      torii --version
      torii --http.cors_origins "*" \
        --world ${DOJO_WORLD_ADDRESS} \
        --rpc ${RPC_URL} \
        --http.port ${L3_TORII_PORT} \
        --grpc.port ${L3_GRPC_PORT} \
        --relay.port ${L3_RELAY_PORT} \
        --relay.webrtc_port ${L3_WEBRTC_PORT} \
        --relay.websocket_port ${L3_WEBSOCKET_PORT} \
        --indexing.contracts \
          erc20:${ACTIONS_TOKEN_ADDRESS},erc721:${GAME_TOKEN_ADDRESS},erc721:${TRAIL_TOKEN_ADDRESS}
  saya:
    cwd: packages/starknet
    env:
      L2_PROFILE: sepolia
      SAYA_TEE_BIN: ./bin/saya-tee
      STARKNET_RPC_URL: https://api.cartridge.gg/x/starknet/sepolia/rpc/v0_9
      KATANA_RPC: http://localhost:6969
      CHAIN_CONFIG_PATH: ./data/dev-sepolia/chain-config
      SAYA_DATA_PATH: ./data/dev-sepolia/saya
    shell: |
      sleep 1
      set -e # exit on error
      source .env.dev-sepolia
      #----------------
      # wait for L2 and L3 to be deployed and initialized
      wait-on -l ../starknet/target/${L2_PROFILE}/initialized
      #----------------
      # gather data...
      #
      export DATA_PATH=./data/${L2_PROFILE}
      export PILTOVER_ADDRESS=$(grep '^core_contract' ${CHAIN_CONFIG_PATH}/config.toml | head -1 | awk -F'"' '{print $2}')
      echo ">>> KATANA_RPC: [${KATANA_RPC}]"
      echo ">>> PILTOVER_ADDRESS: [${PILTOVER_ADDRESS}]"
      echo ">>> FACT_REGISTRY_ADDRESS: [${FACT_REGISTRY_ADDRESS}]"
      echo ">>> DEPLOYER_ADDRESS: [${DEPLOYER_ADDRESS}]"
      echo ">>> DEPLOYER_PRIVATE_KEY: [${DEPLOYER_PRIVATE_KEY}]"
      echo ">>> PROVER_PRIVATE_KEY: [${PROVER_PRIVATE_KEY}]"
      echo ">>> SAYA_TEE_BIN: [${SAYA_TEE_BIN}]"
      #----------------
      # sytart saya
      #
      echo ">>> Starting Saya on [${SAYA_DATA_PATH}]..."
      mkdir -p ${SAYA_DATA_PATH}
      ${SAYA_TEE_BIN} --version
      ${SAYA_TEE_BIN} tee start \
        --mock-prove \
        --rollup-rpc                     "${KATANA_RPC}" \
        --settlement-rpc                 "${STARKNET_RPC_URL}" \
        --settlement-piltover-address    "${PILTOVER_ADDRESS}" \
        --settlement-account-address     "${DEPLOYER_ADDRESS}" \
        --settlement-account-private-key "${DEPLOYER_PRIVATE_KEY}" \
        --tee-registry-address           "${FACT_REGISTRY_ADDRESS}" \
        --prover-private-key             "${PROVER_PRIVATE_KEY}" \
        --db-dir                         "${SAYA_DATA_PATH}" \
        --batch-size                     "1" \
        --attestor-poll-interval-ms      "1000" \
        --idle-timeout-secs              "30"








